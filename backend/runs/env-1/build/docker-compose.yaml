name: cyblocks_env-1
networks:
  cyblocks_env-1_dmz:
    driver: bridge
    ipam:
      config:
      - subnet: 172.20.0.0/24
        gateway: 172.20.0.1
  cyblocks_env-1_internal:
    driver: bridge
    ipam:
      config:
      - subnet: 10.0.0.0/24
        gateway: 10.0.0.1
services:
  edge-router:
    container_name: cyblocks_env-1_edge-router
    image: frrouting/frr
    cap_add:
    - NET_ADMIN
    sysctls:
      net.ipv4.ip_forward: '1'
    networks:
      cyblocks_env-1_dmz:
        ipv4_address: 172.20.0.254
      cyblocks_env-1_internal:
        ipv4_address: 10.0.0.254
  web-server:
    container_name: cyblocks_env-1_web-server
    networks:
      cyblocks_env-1_dmz:
        ipv4_address: 172.20.0.2
    build: ./dockerfiles/web-server
    mem_limit: 512m
    ports:
    - 80:80
  db-server:
    container_name: cyblocks_env-1_db-server
    networks:
      cyblocks_env-1_internal:
        ipv4_address: 10.0.0.2
    image: mysql:8
    mem_limit: 1g
